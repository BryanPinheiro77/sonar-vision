name: Benchmark simulado (manual)

# Opcional e manual: nunca roda em PR nem bloqueia merge. Mede o caminho
# cliente -> HTTPS -> API com backend SIMULADO; os números dependem do runner e
# não são latência real nem acurácia (docs/integration.md, docs/ci.md).
on:
  workflow_dispatch:
    inputs:
      frames:
        description: Número de frames sintéticos
        default: '50'
        required: true

permissions:
  contents: read

jobs:
  benchmark:
    name: Benchmark simulado
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install pinned API dependencies
        run: python -m pip install -e '.[api,api-dev]'
      - name: Run simulated end-to-end benchmark
        env:
          FRAMES: ${{ inputs.frames }}
        run: |
          case "$FRAMES" in ''|*[!0-9]*) echo "frames deve ser inteiro" >&2; exit 1 ;; esac
          python -m sonar_vision_integration.bench --frames "$FRAMES" --output benchmark-report/report.json
      - name: Upload report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-simulated
          path: benchmark-report/
          retention-days: 14
