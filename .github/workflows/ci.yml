name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install Ruff
        run: python -m pip install ruff==0.16.10
      - name: Check Python source and tests
        run: ruff check --select E4,E7,E9,F src tests
      - name: Check Python syntax
        run: python -m compileall -q src tests

  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project
        run: python -m pip install -e .
      - name: Run tests without optional ML dependencies
        run: python -m unittest discover -s tests -v

  vision-integration:
    name: Vision integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install pinned vision dependencies
        run: python -m pip install -e '.[vision]'
      - name: Confirm real tracker dependencies are present
        run: python -c "import cv2, lap, numpy, ultralytics; print('Vision dependencies available')"
      - name: Run real ByteTrack tests
        run: python -m unittest discover -s tests -p test_ultralytics_backend.py -v
      - name: Run complete test suite
        run: python -m unittest discover -s tests -v

  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install pinned API dependencies
        run: python -m pip install -e '.[api,api-dev]'
      - name: Confirm HTTP/HTTPS test dependencies are present
        run: python -c "import fastapi, httpx2, python_multipart, trustme, uvicorn; print('API dependencies available')"
      - name: Run suite with API extras (HTTPS with a local CA, catalog routes)
        run: python -m unittest discover -s tests -v

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
