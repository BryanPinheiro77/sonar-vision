name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Ruff
        run: python -m pip install ruff==0.16.10
      - name: Check Python source and tests
        run: ruff check --select E4,E7,E9,F src tests
      - name: Check Python syntax
        run: python -m compileall -q src tests

  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project
        run: python -m pip install -e .
      - name: Run tests without optional ML dependencies
        run: python -m unittest discover -s tests -v

  vision-integration:
    name: Vision integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned vision dependencies
        run: python -m pip install -e '.[vision]'
      - name: Confirm real tracker dependencies are present
        run: python -c "import cv2, lap, numpy, ultralytics; print('Vision dependencies available')"
      - name: Run real ByteTrack tests
        run: python -m unittest discover -s tests -p test_ultralytics_backend.py -v
      - name: Run complete test suite
        run: python -m unittest discover -s tests -v

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
